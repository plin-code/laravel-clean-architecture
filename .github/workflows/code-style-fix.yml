name: Code Style (Auto-fix)

# Not part of the quality gate and never triggered automatically: this workflow
# rewrites files and pushes a commit, so it must never race the code-style check
# that guards pull requests. Run it by hand from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: json, dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run Pint (fix mode)
        run: vendor/bin/pint

      - name: Commit linted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix coding style issues with Pint 🤖"
          skip_dirty_check: false 